name: Apply Cozy Brews UI upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message != 'Fix premium UI injection newlines'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix injected UI markup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # The previous workflow accidentally wrote the two UI blocks with
          # literal backslash-n characters, so the JavaScript never executed.
          # Normalize only the generated premium blocks.
          for marker, closing in [
              ('<style id="cozy-premium-home-css">', '</style>'),
              ('<script id="cozy-premium-home-js">', '</script>')
          ]:
              start = html.find(marker)
              if start == -1:
                  continue
              end = html.find(closing, start)
              if end == -1:
                  continue
              end += len(closing)
              block = html[start:end]
              block = block.replace('\\\\n', '\n')
              html = html[:start] + block + html[end:]

          # Also remove a literal \n immediately before the generated tags.
          html = html.replace('\\n<style id="cozy-premium-home-css">', '<style id="cozy-premium-home-css">')
          html = html.replace('\\n<script id="cozy-premium-home-js">', '<script id="cozy-premium-home-js">')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix premium UI injection newlines"
          git push
