name: Apply cancelled order swipe fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove literal backslash-n artifacts left by the old UI injection.
          s=s.replace('\\\\n','')
          # Remove any previous copy of the swipe script tag.
          import re
          s=re.sub(r'\\s*<script[^>]+src=["\'](?:\\./)?swipe-delete\\.js["\'][^>]*></script>', '', s, flags=re.I)
          tag='\\n<script src="./swipe-delete.js"></script>\\n'
          if 'swipe-delete.js' not in s:
              pos=s.lower().rfind('</body>')
              if pos>=0:
                  s=s[:pos]+tag+s[pos:]
              else:
                  s+=tag
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix cancelled order swipe delete and literal newlines'
          git push
